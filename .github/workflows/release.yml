name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Get latest tag
        id: get_tag
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT

      - name: Calculate next version
        id: next_version
        run: |
          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          BUMP_TYPE="${{ github.event.inputs.version_bump || 'patch' }}"

          case $BUMP_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Next version: ${NEW_VERSION}"

      - name: Build binaries
        run: |
          VERSION=${{ steps.next_version.outputs.new_version }}
          COMMIT=${{ github.sha }}
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X github.com/hermitmaster/aictl/internal/cli.version=${VERSION} -X github.com/hermitmaster/aictl/internal/cli.commit=${COMMIT} -X github.com/hermitmaster/aictl/internal/cli.buildDate=${BUILD_DATE}"

          mkdir -p dist

          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/aictl-linux-amd64 ./cmd/aictl
          GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/aictl-linux-arm64 ./cmd/aictl
          GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/aictl-darwin-amd64 ./cmd/aictl
          GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/aictl-darwin-arm64 ./cmd/aictl
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/aictl-windows-amd64.exe ./cmd/aictl

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.next_version.outputs.new_version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.next_version.outputs.new_version }} already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.next_version.outputs.new_version }} -m "Release ${{ steps.next_version.outputs.new_version }}"
          git push origin ${{ steps.next_version.outputs.new_version }}

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next_version.outputs.new_version }}
          name: Release ${{ steps.next_version.outputs.new_version }}
          generate_release_notes: true
          files: |
            dist/aictl-*
            dist/checksums.txt
